name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      # pdftotext is required by the PDF baseline check.
      - name: Install poppler-utils
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - run: pnpm install --frozen-lockfile

      - run: pnpm check:all

      # V8 counts branches differently from one Node version to the next: the coverage thresholds hold on this one.
      - if: matrix.node-version == 24
        run: pnpm test:coverage

  # The package supports Node >= 20 but dev tooling needs Node 22+: build on 22, run the output on 20.
  smoke-node20:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: node scripts/smoke.mjs
